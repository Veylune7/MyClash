<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>South Korea</title>
  <!-- Flag rectangle, same wide proportions as other region icons (Japan/Taiwan/Singapore) -->
  <!-- White flag with light gray border so it stands out on white UI -->
  <rect x="15" y="157" width="994" height="710" rx="60" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="3"/>
  <!-- Taegeuk: red top / blue bottom with S-curve, centered on flag -->
  <g>
    <path d="M512 332 a180 180 0 0 1 0 360 a90 90 0 0 1 0 -180 a90 90 0 0 0 0 -180" fill="#CD2E3A"/>
    <path d="M512 692 a180 180 0 0 1 0 -360 a90 90 0 0 1 0 180 a90 90 0 0 0 0 180" fill="#0047A0"/>
  </g>
  <!-- Trigrams: black bars, placed at flag corners, rotated to face center -->
  <!-- Top-left: Geon (3 solid) -->
  <g transform="translate(150 280) rotate(45)">
    <rect x="-55" y="-58" width="110" height="22" fill="#000000"/>
    <rect x="-55" y="-11" width="110" height="22" fill="#000000"/>
    <rect x="-55" y="36" width="110" height="22" fill="#000000"/>
  </g>
  <!-- Top-right: Ri (broken, solid, broken) -->
  <g transform="translate(874 280) rotate(-45)">
    <rect x="-55" y="-58" width="50" height="22" fill="#000000"/>
    <rect x="5" y="-58" width="50" height="22" fill="#000000"/>
    <rect x="-55" y="-11" width="110" height="22" fill="#000000"/>
    <rect x="-55" y="36" width="50" height="22" fill="#000000"/>
    <rect x="5" y="36" width="50" height="22" fill="#000000"/>
  </g>
  <!-- Bottom-left: Gam (solid, broken, solid) -->
  <g transform="translate(150 744) rotate(-45)">
    <rect x="-55" y="-58" width="110" height="22" fill="#000000"/>
    <rect x="-55" y="-11" width="50" height="22" fill="#000000"/>
    <rect x="5" y="-11" width="50" height="22" fill="#000000"/>
    <rect x="-55" y="36" width="110" height="22" fill="#000000"/>
  </g>
  <!-- Bottom-right: Gon (3 broken) -->
  <g transform="translate(874 744) rotate(45)">
    <rect x="-55" y="-58" width="50" height="22" fill="#000000"/>
    <rect x="5" y="-58" width="50" height="22" fill="#000000"/>
    <rect x="-55" y="-11" width="50" height="22" fill="#000000"/>
    <rect x="5" y="-11" width="50" height="22" fill="#000000"/>
    <rect x="-55" y="36" width="50" height="22" fill="#000000"/>
    <rect x="5" y="36" width="50" height="22" fill="#000000"/>
  </g>
</svg>
